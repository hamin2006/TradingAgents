# Daily paper-trading configuration. Merge layer over tradingagents/default_config.py.
seed_watchlist: [AAPL, MSFT, NVDA, GOOGL, AMZN, META, TSLA]   # used until the first screen

llm_provider: openrouter
quick_think_llm: deepseek/deepseek-v4-flash-0731   # dated snapshot, cheaper prompt pricing
deep_think_llm: deepseek/deepseek-v4-pro
output_language: English
max_tokens: 15000         # output-token cap forwarded to every provider client:
                          # deepseek-v4-flash runs away uncapped (100K+ token
                          # outputs, 20+ min calls — upstream #1204). Measured
                          # live 2026-09-03: pathological prompt completed in
                          # 85s with full content at cap=8000; 15K = headroom
                          # above typical content (~2-3K tok) + reasoning.

# Pin OpenRouter routing per model slug (multiple hosts serve the same model;
# pin to the preferred host; fallbacks stay enabled). Unknown models route unpinned.
openrouter_provider_pins:
  deepseek/deepseek-v4-flash-0731: Relace
  deepseek/deepseek-v4-pro: StreamLake

capital: 10000            # paper capital (matches real paper-account cash)
max_positions: 10          # position-count cap AND equal-weight denominator
max_order_value_cap: 15000 # per-day total buy cap
stop_loss_pct: 8.0         # broker-side GTC stop on every buy (0 disables)
tripwire_gap_pct: 5.0     # pre-open pause: BUY skipped if pre-market quote is
                          # this % below the reference close (overnight events)
fundamentals_source: edgar  # "edgar" = SEC companyfacts as-filed statements
                            # + 8-K announced-quarter freshness layer (live
                            # 2026-09-04); yfinance fallback stays automatic
                            # per ticker (structural quality gate); consensus/
                            # dividends/sector remain Yahoo-labeled
conviction_weights:        # slice multiplier per rating (base = capital / max_positions)
  Buy: 1.5
  Overweight: 1.0
analyze_max_workers: 4     # parallel ticker analyses in the morning pass

screener:
  universe: sp500
  pool_size: 50            # ranked queue depth the daily draw may use
  candidate_slots: 8       # candidates drawn daily from the ranked queue
  min_watchlist_size: 5    # production gate (test: 1)
  exclusion_days: 0        # churn guard OFF (2026-09-04): rank alone spaces re-looks —
                           # a name that doesn't move doesn't rank; one that rips (catalyst)
                           # rises. Window only ever delayed re-entry (PLTR/HOOD class).
  entry_protection_pct: 5.0
  regime_gate: true        # SPY/SMA200 x VIX: WARN drops 1m tail, STRESS pauses buys
  min_buy_quota: 5         # keep analyzing deeper pool candidates until this many
                           # agent-approved buys (Buy/Overweight) are found
  max_analyze: 16          # hard cap on tickers analyzed per morning: batch must
                           # finish before the 09:00 ET execute checkpoint
                           # (~3h with 4 workers from a 04:30 ET start)

# Active broker backend. "alpaca" = Alpaca paper API (instant, no daemon —
# keys from ALPACA_API_KEY / ALPACA_SECRET_KEY env vars). Flip to "ibkr"
# when a paper Gateway is running (see SETUP.md); both share one interface.
broker: alpaca
alpaca:
  paper: true                # ALWAYS true for this system — never live

# PM execution intent (spec 2026-09-04; all code landed, production OFF).
# execution_intent = observe phase: the PM's structured decision gains an
#   `execution` block; per-ticker dated decision cards are written and
#   injected into future PM prompts (confirm-or-refute); compliance events
#   stream. Engine behavior is unchanged (legacy tier sizing).
# pm_execution = binding phase: valid execution blocks REPLACE the legacy
#   tier orders for their tickers (sizes, limits, stops, partial sells);
#   explicit empty block = no order today; invalid/absent = legacy fallback.
execution_intent: true
pm_execution: false
stop_px_band_pct: [3, 25]  # PM stop clamp band (% below reference close)
min_order_value_usd: 50    # order-size floor after rounding
card_max_age_days: 21      # decision-card freshness gate for PM injection
card_flip_inject_max: 3    # cards injected when the latest two ratings flip

ibkr:
  host: 127.0.0.1
  port: 7497               # paper trading port
  client_id: 1

trading_enabled: true      # false = analysis-only; DISABLE_TRADING file also works
