# Daily paper-trading configuration. Merge layer over tradingagents/default_config.py.
seed_watchlist: [AAPL, MSFT, NVDA, GOOGL, AMZN, META, TSLA]   # used until the first screen

llm_provider: openrouter
quick_think_llm: deepseek/deepseek-v4-flash-0731   # dated snapshot, cheaper prompt pricing
deep_think_llm: deepseek/deepseek-v4-pro
output_language: English

# Pin OpenRouter routing per model slug (multiple hosts serve the same model;
# pin to the first-party provider). Unknown models route unpinned.
openrouter_provider_pins:
  deepseek/deepseek-v4-flash-0731: Fireworks
  deepseek/deepseek-v4-pro: StreamLake
  deepseek/deepseek-v4-pro: DeepSeek

capital: 100000            # paper capital
max_positions: 10          # position-count cap AND equal-weight denominator
max_order_value_cap: 15000 # per-day total buy cap
stop_loss_pct: 8.0         # broker-side GTC stop on every buy (0 disables)
conviction_weights:        # slice multiplier per rating (base = capital / max_positions)
  Buy: 1.5
  Overweight: 1.0
analyze_max_workers: 4     # parallel ticker analyses in the morning pass

screener:
  universe: sp500
  pool_size: 50            # ranked queue depth the daily draw may use
  candidate_slots: 8       # candidates drawn daily from the ranked queue
  min_watchlist_size: 5    # production gate (test: 1)
  exclusion_days: 3        # churn guard; keep candidates as fresh as possible
  entry_protection_pct: 5.0
  regime_gate: true        # SPY/SMA200 x VIX: WARN drops 1m tail, STRESS pauses buys

# Active broker backend. "alpaca" = Alpaca paper API (instant, no daemon —
# keys from ALPACA_API_KEY / ALPACA_SECRET_KEY env vars). Flip to "ibkr"
# when a paper Gateway is running (see SETUP.md); both share one interface.
broker: alpaca
alpaca:
  paper: true                # ALWAYS true for this system — never live

ibkr:
  host: 127.0.0.1
  port: 7497               # paper trading port
  client_id: 1

trading_enabled: true      # false = analysis-only; DISABLE_TRADING file also works
